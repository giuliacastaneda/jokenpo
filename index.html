<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
    <title>JOKENPO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head> 
<body class="scanlines">  
   
    <div class="arcade-marquee">
        <div class="marquee-text">
     *** JOKENPO ARCADE *** PEDRA • PAPEL • TESOURA *** INSERT COIN ***
        </div>
        </div>
    <header>
        <div class="box">
        <h1 class="titulo">JO-KEN-PO</h1>
        <p class="subTitulo"> ☻ 1986 PIXEL GAMES CO.</p>
      </div>
    </header>

    <main>
        <div class="box-jogo">
            <div class="placar-jogador">
                <h3>1P >> VOCE</h3>
                <h3 id="placar-jogador">00</h3>
                <p id="barraJogador">▬▬▬▬▬▬▬▬▬▬▬</p>
            </div>
            <p> X </p>
            <div class="placar-cpu">
                <h3>2P >> CPU</h3>
                <h3 id="placar-cpu">00</h3>
                <p id="barraCpu">▬▬▬▬▬▬▬▬▬▬▬</p>
            </div>            
        </div>

        <div class="box-jogo">
            <div class="player">
                 <p id="player"> PLAYER </p>
                 <p id="fechado1" >✊</p>
                 <p id="aberto1">???</p>
            </div>
            <div class="centro-jogo">
                <br>
                <p id="contador"> VS </p>
            </div>
            <div class="enemy">
                    <p id="enemy"> ENEMY </p>
                    <p id="fechado2">✊</p>
                    <p id="aberto2">???</p>
            </div>
            <div id="resultado" class="texto-pisca"> 
                ESCOLHA SUA JOGADA 
            </div>
        </div>

        <div id="box-escolha">
            <button id="pedra" class="botao">
                <span class="emoji">👊</span>
                <span class="texto">PEDRA</span>
            </button>

            <button id="papel" class="botao">
                <span class="emoji">✋</span>
                <span class="texto">PAPEL</span>
            </button>

            <button id="tesoura" class="botao">
                <span class="emoji">✌️</span>
                <span class="texto">TESOURA</span>
            </button>
           
        </div> 
            <div id="reset">
            <button id="jogar-novamente" class="escondido">
            JOGAR DE NOVO
            </button>
            <button id="zerar-placar" class="escondido">
            ZERAR
            </button>
            </div>
    </main>
    <footer>
        <p id="rodape">INSERT COIN TO CONTINUE</p>
        <img src="img\coin.png" alt="moeda" id="moeda-caindo" class="escondido">
        <br>

       <h6> © 2026 Giulia Castañeda - <a href="https://www.linkedin.com/in/giuliacastaneda/" target="_blank"> Linkedin</a></h6>
    </footer>

</body>
</html>
