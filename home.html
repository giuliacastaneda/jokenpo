<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="jogo.css">
    <script type="module" src="jogo.js"></script>
    <title>JOKENPO</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.glitch.global/8ff313da-1dcc-45d6-8163-d9dda5d323f1/favicon-32x32.png?v=1744744460894">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head> 
<body class="scanlines">  
   
    <div class="arcade-marquee">
        <div class="marquee-text">
     *** JOKENPO ARCADE *** PEDRA • PAPEL • TESOURA *** INSERT COIN ***
        </div>
        </div>
    <header>
        <div class="box">
        <h1 class="titulo">JO-KEN-PO</h1>
        <p class="subTitulo"> ☻ 1986 PIXEL GAMES CO.</p>
      </div>
    </header>

    <main>
        <section class="box-jogo">
            <div class="placar-jogador">
                <h2>1P >> VOCE</h2>
                <p id="placarJogador">00</p>
                <p id="barraJogador">▬▬▬▬▬</p>
            </div>
            <p> X </p>
            <div class="placar-cpu">
                <h2>2P >> CPU</h2>
                <p id="placarCpu">00</p>
                <p id="barraCpu">▬▬▬▬▬</p>
            </div>            
        </section>

        <section class="box-jogo">
            <div class="player">
                 <p> PLAYER </p>
                 <p id="fechado1" >✊ </p>
                 <p id="aberto1"> ??? </p>
            </div>
            <div class="centro-jogo">
                <br>
                <p id="contador"> VS </p>
            </div>
            <div class="enemy">
                    <p> ENEMY </p>
                    <p id="fechado2">✊</p>
                    <p id="aberto2"> ??? </p>
            </div>
            <div id="resultado"> 
                ESCOLHA SUA JOGADA 
            </div>
        </section>

        <section class="box-escolha">
            <button id="pedra" class="botao">
                <span class="emoji">👊</span>
                <span class="texto">PEDRA</span>
            </button>

            <button id="papel" class="botao">
                <span class="emoji">✋</span>
                <span class="texto">PAPEL</span>
            </button>

            <button id="tesoura" class="botao">
                <span class="emoji">✌️</span>
                <span class="texto">TESOURA</span>
            </button>
        </section>
        <br>
        <br>
       <!-- 🤚 ✊ ✌️ 👊
        ** VITORIA! ** com bordas amarelas == EMPATE! == cinza * CPU GANHOU * vermelho
        contabilizar no placar js e alterar os resultados--> 
    </main>
    <footer>
         <!-- Colocar moeda pulando ao clicar --> 
        <p class="rodape">INSERT COIN TO CONTINUE</p>
    </footer>

</body>
</html>
